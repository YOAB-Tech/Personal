
{% extends "layout.html" %}
{% block style %}
<link rel="stylesheet" href="/static/index.css">
{% endblock %}
{% block title %}Homepage{% endblock %}
{% block body %}

<!-- 1. The Background Image (p2) -->
<div class="bg-image"></div>

<!-- 2. The Liquid Glass Sidebar (p3) -->
<div class="glass-sidebar">
    {% if prompt %}
    <a href="/homepage/{{prompt}}" class="glass-nav-button">
        <span class="icon">🏠</span> Homepage
    </a>
    {% else %}
    <a href="/login" class="glass-nav-button">
        <span class="icon">🏠</span> Homepage
    </a>
    {% endif %}
    <!-- You can add more buttons here later -->
    <a href="/about" class="glass-nav-button">
        <span class="icon">ℹ️</span> About
    </a>
</div>

<!-- 3. Your existing main content goes here -->
<div class="main-content">
    <h1>Welcome</h1>
    <p>Your login form or other content can go here.</p>
</div>

<!-- 4. Styles for this specific page -->


  <!-- 脚注：固定在页面底部 -->
<div style="border-top: 1px solid rgb(0, 0, 0); position: fixed; bottom: 0; left: 0; width: 100%; box-sizing: border-box; padding: 10px; font-size: 15px; text-align: center;">
  <a href="/about" class = "homepagelink">About</a>
  <a href="/repo" class = "homepagelink">Repository</a>
</div>


{% endblock %}
