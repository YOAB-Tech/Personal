
{% extends "layout.html" %}
{% block style %}
<link rel="stylesheet" href="/static/index.css">
{% endblock %}
{% block title %}Homepage{% endblock %}
{% block body %}

<!-- 1. The Background Image (p2) -->
<div class="bg-image"></div>

<!-- 2. The Liquid Glass Sidebar (p3) -->
<div class="glass-sidebar">
    {% if prompt %}
    <a href="/homepage/{{prompt}}" class="glass-nav-button">
        <img src = "/static/home.png" alt = "Home" class = "icon">
        Homepage
    </a>
    {% else %}
    <a href="/login" class="glass-nav-button">
        <img src = "/static/home.png" alt = "Home" class = "icon">
        Homepage
    </a>
    {% endif %}
    <!-- You can add more buttons here later -->
    <a href="/repo" class="glass-nav-button">
        <img src = "/static/repo.png" alt = "Repo" class = "icon">
        Repository
    </a>
    <a href="/about" class = "homepagelink">Contact</a>

</div>

<!-- 3. Your existing main content goes here -->
<div class="main-content">
    <h1>Welcome</h1>
    <p>Your login form or other content can go here.</p>
</div>

<!-- 4. Styles for this specific page -->





{% endblock %}
