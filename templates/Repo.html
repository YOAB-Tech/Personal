{% extends "layout.html" %}
{% block style %}
<link rel="stylesheet" href="/static/page.css">
{% endblock %}
{% block title %}Repository{% endblock %}
{% block body %}

<a href="/" class="page-back">← Back to home</a>

<main class="page-shell">
    <div class="content-card">
        <span class="eyebrow">Repository</span>
        <h1 class="page-title">Repository</h1>
        <p class="page-lead">Browse, organise and download your uploaded files.</p>

        <div class="repo-empty">
            <div class="repo-empty-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            </div>
            <p>No repository selected yet.</p>
            <a href="{% if session['user'] %}/homepage/{{ session['user'] }}{% else %}/login{% endif %}" class="primary-button">Open your workspace</a>
        </div>
    </div>
</main>

{% endblock %}
