{% extends "layout.html" %}
{% block style %}
<link rel = "stylesheet" type = "text/css" href = "/static/homepage.css">
{% endblock %}
{% block title %}
homepage
{% endblock %}
{% block body %}
<div class = "bg-image"></div>
<div class="glass-sidebar">
    <a href="/homepage/{{ session['user'] }}" class="glass-nav-button">
        <span class="icon">🏠</span> Home
    </a>
    <a href="/about" class="glass-nav-button">
        <span class="icon">ℹ️</span> About
    </a>
</div>

<!-- 2. The Main Content (Upload form goes here) -->
<div class="main-content">
    <h1>Welcome, {{ session['user'] }}</h1>
    <p>Upload files or a folder below.</p>

    <div class="upload-card">
        <form method="POST" enctype="multipart/form-data">
            <label class="upload-label">Select Files or Folder:</label>

            <input type="file" name="file" multiple class="file-input">
            <input type="file" name="file" webkitdirectory directory multiple class="file-input">

            <button type="submit" class="glass-button">Upload</button>
        </form>
    </div>

    <button id="back" type="button" class="glass-button" style="margin-top: 20px;">Back</button>
</div>
  {% if prompt %}
<script>
  window.addEventListener("load", function () {
    Swal.fire({
      icon: "{{ 'success' if 'success' in prompt else 'error' }}",
      title: "{{ prompt }}",
      timer: 2000,
      showConfirmButton: false
    });
    window.location.href = "/";

  });
  window.addEventListener("load",function(){
    const button = document.getElementById("back");
    button.addEventListener("click",function(){
      window.location.href = "/";
    });
  });
</script>
{% endif %}
<script>
  window.addEventListener("load",function(){
    const button = document.getElementById("back");
    button.addEventListener("click",function(){
      window.location.href = "/";
    });
  });
</script>
{% endblock %}
