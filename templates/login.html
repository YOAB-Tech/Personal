{% extends "layout.html" %}
{% block style %}
<link rel="stylesheet" href="static/login.css">
{% endblock %}
{% block title %}Sign In{% endblock %}
{% block body %}
<div class="login-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;">
    <form action="/login" method="POST" class="glass-form">

        <!-- Top Icon -->
        <div style="display: flex; justify-content: center; margin-bottom: 20px;">
            <div style="width: 64px; height: 64px; background: #e0e7ff; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
        </div>

        <h2 class="form-title">Sign In</h2>
        <p class="form-subtitle">Welcome back! Please enter your details.</p>

        <!-- Username Input -->
        <div class="input-group">
            <label class="input-label">Username</label>
            <div class="input-wrapper">
                <div class="input-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <input type="text" name="username" placeholder="Enter your username" required class="glass-input">
            </div>
        </div>

        <!-- Password Input -->
        <div class="input-group">
            <label class="input-label">Password</label>
            <div class="input-wrapper">
                <div class="input-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
                <input type="password" name="password" placeholder="Enter your password" required class="glass-input">
                <button type="button" class="toggle-password" onclick="togglePassword('password')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
        </div>

        <!-- Alert Prompt Container -->
        <div id="alert-container">
            {% if prompt %}
            <span id="prompt-text">{{ prompt }}</span>
            {% endif %}
        </div>

        <!-- Submit Button -->
        <button type="submit" class="glass-button">Sign In</button>

        <div class="form-footer">
            Don't have an account? <a href="/register">Register</a>
        </div>
    </form>
</div>

<script>
    function togglePassword(inputName) {
        const input = document.querySelector(`input[name="${inputName}"]`);
        if (input.type === "password") {
            input.type = "text";
        } else {
            input.type = "password";
        }
    }
</script>
{% endblock %}
